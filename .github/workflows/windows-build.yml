name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenSSL
        shell: pwsh
        run: choco install openssl --no-progress -y

      - name: Configure CMake
        shell: pwsh
        run: |
          $opensslRoot = "C:/Program Files/OpenSSL"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPENSSL_ROOT_DIR="$opensslRoot" `
            -DOPENSSL_INCLUDE_DIR="$opensslRoot/include" `
            -DOPENSSL_SSL_LIBRARY="$opensslRoot/lib/VC/x64/MD/libssl.lib" `
            -DOPENSSL_CRYPTO_LIBRARY="$opensslRoot/lib/VC/x64/MD/libcrypto.lib" `
            -DCPR_BUILD_TESTS=OFF `
            -DCPR_BUILD_TESTS_SSL=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/ORACULUM.exe artifact/
          Get-ChildItem build -Recurse -Filter "*.dll" | Copy-Item -Destination artifact/ -Force
          Get-ChildItem "C:/Program Files/OpenSSL/bin" -Filter "*.dll" | Copy-Item -Destination artifact/ -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORACULUM-windows-x64
          path: artifact/*
